<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#g)"/>
  <!-- Box outline -->
  <rect x="22" y="30" width="40" height="40" rx="4" stroke="white" stroke-width="4" fill="none"/>
  <!-- Arrow pointing into box -->
  <line x1="78" y1="50" x2="55" y2="50" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <polyline points="62,42 55,50 62,58" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Question mark -->
  <text x="42" y="57" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="white" text-anchor="middle">?</text>
</svg>
